services:
  - type: web
    name: afyoraBE
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Free web services do not support pre-deploy commands. Running migrations
    # before Gunicorn starts ensures a newly selected primary has its schema.
    startCommand: python manage.py migrate --noinput && gunicorn afyoraBE.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Supabase is the application primary. Supply its direct PostgreSQL URL
      # in the Render dashboard (not the Supabase REST URL).
      - key: SUPABASE_DATABASE_URL
        sync: false
      # This database is used only by the external backup-sync command.
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: afyorabe-db
          property: connectionString
      # Supply this secret in the Render dashboard. The sender configured below
      # must also be verified in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: afyorabe-db
    plan: free
